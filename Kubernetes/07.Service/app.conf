server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    #########################
    # App1
    #########################
    # Serve all /app1/ requests
    location /app1/ {
        alias /usr/share/nginx/html/app1/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # Redirect exact /app1 → /app1/
    location = /app1 {
        return 301 $scheme://$host/app1/;
    }

    #########################
    # App2
    #########################
    # Serve all /app2/ requests
    location /app2/ {
        alias /usr/share/nginx/html/app2/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # Redirect exact /app2 → /app2/
    location = /app2 {
        return 301 $scheme://$host/app2/;
    }

    #########################
    # Default 404
    #########################
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}