apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app1
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: nginx
        image: 230882/nginx:app1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc1
spec:
  type: NodePort
  selector:
    app: app1
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30081
---