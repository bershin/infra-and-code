apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app3
  labels:
    app: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
      - name: nginx
        image: 230882/nginx:default
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc3
spec:
  type: NodePort
  selector:
    app: default
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30083
---