apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app1-pvc
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: app1-pod
spec:
  containers:
  - name: app1
    image: nginx 
    ports:
      - containerPort: 80
    volumeMounts:
    - name: app1-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: app1-volume
    persistentVolumeClaim:
      claimName: app1-pvc
---