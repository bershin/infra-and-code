server {
    listen 8081;
    server_name localhost;

    location / {
        root /usr/share/nginx/html/app1;
        index index.html index.htm;
    }
    error_page 404  /404.html;
    location = /404.html{
        internal;
    }
}

server {
    listen 8082;
    server_name localhost;

    location / {
        root /usr/share/nginx/html/app2;
        index index.html index.htm;
    }
    error_page 404  /404.html;
    location = /404.html{
        root internal;
    }
}