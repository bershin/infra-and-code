apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: my-backend-cookies
spec:
  timeoutSec: 42
  connectionDraining:
    drainingTimeoutSec: 62
  logging:
    enable: true
    sampleRate: 1.0
  healthCheck:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /index.html
    port: 80
---