name: key-val-app
services:
  db:
    image: mongodb/mongodb-community-server:7.0.22-ubuntu2204
    ports:
      - "27017:27017"
    env_file:
      - .env.db-root-cred
      - .env.db-user-cred
    volumes:
      - type: bind
        source: ./db-config/mongodb-init.js
        target: /docker-entrypoint-initdb.d/mongodb-init.js
      - type: volume
        source: mongodb-data
        target: /data/db
    networks:
      - key-value-net

volumes:
  mongodb-data:
networks:
  key-value-net: