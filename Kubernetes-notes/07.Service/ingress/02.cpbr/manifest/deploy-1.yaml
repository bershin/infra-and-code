kind: Deployment
apiVersion: apps/v1
metadata:
  name: app1-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: 230882/ingress-demo-app1:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1-service 
spec:
  type: NodePort
  selector:
    app: app1
  ports:
  - port: 80
    targetPort: 80