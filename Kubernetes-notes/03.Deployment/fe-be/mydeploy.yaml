apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: be
  name: my-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
      - image: 230882/my-deploy:v2
        name: pod-be
---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: be
  name: my-bkend-lb
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: be
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fe
  name: my-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      containers:
      - image: 230882/my-fe:v3
        name: pod-fe
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: fe
  name: my-fe-lb
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: fe
  type: LoadBalancer
