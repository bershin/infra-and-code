apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-deployment
spec:
  selector:
    matchLabels:
      app: default
  template:
    metadata:
      labels:
        app: default
    spec:
      containers:
      - name: default
        image: 230882/ingress-demo-default:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: default-service
  annotations:
    cloud.google.com/backend-config: '{"default": "my-backend-config"}'
spec:
  type: NodePort
  selector:
    app: default
  ports:
  - port: 80
    targetPort: 80
---