apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: my-backend-config
spec:
  cdn:
    enabled: true
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
  timeoutSec: 42
  connectionDraining:
    drainingTimeoutSec: 62
  logging:
    enable: true
    sampleRate: 1.0
---