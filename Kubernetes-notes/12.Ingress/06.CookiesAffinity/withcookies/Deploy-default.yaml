apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookies-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cookies
  template:
    metadata:
      labels:
        app: cookies
    spec:
      containers:
      - name: cookies-container
        image: 230882/affinity-demo:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cookies-service
  annotations:
    cloud.google.com/backend-config: '{"default": "my-backend-cookies"}'
spec:
  type: NodePort
  selector:
    app: cookies
  ports:
  - port: 80
    targetPort: 80
---